<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三餐日記</title>
<meta name="description" content="記錄一日三餐、喝水和飲品，看看自己吃飯喝水規不規律。紀錄只存在自己的手機上。">
<meta name="theme-color" content="#F8E6A0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="三餐日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-css" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Sacramento&display=swap">
<style>
/* Layout: one phone-width column. The day reads top to bottom as three palette blocks
   (citrus zest / sea breeze / amalfi tile) that fill with color as each meal is logged;
   water fills a glass in sea breeze; tabs sit in a bottom bar within thumb reach. */
:root {
  --citrus: #FFA62B; --breeze: #86C5FF; --amalfi: #2E5AA7; --gelato: #F8E6A0;

  --bg: #FFF8E6; --surface: #FFFDF7; --raised: #FFFFFF;
  --ink: #1D386B; --ink-2: #5D6F92; --ink-3: #9AA6BE;
  --line: #EFE4C2; --line-2: #E3D4A6;
  --accent: #2E5AA7; --on-accent: #FFF5D2; --focus: #2E5AA7;
  --ok: #2E9E5B; --ok-ink: #23784A; --danger: #B4402C;
  --tint-b: #FFEACB; --tint-l: #DDEEFF; --tint-d: #E0E7F4;
  --edge-b: #F2C27A; --edge-l: #9CCBF6; --edge-d: #A5B7DD;
  --mark-b: #F2981C; --mark-l: #4FA3EE; --mark-d: #2E5AA7;
  --word-b: #E0870A; --word-l: #3A90DE; --word-d: #2E5AA7;
  --full-bg: #FCEFC4;
  --scrim: rgba(20, 32, 58, .42);
  --nav-bg: rgba(255, 250, 236, .94);
  --shadow: 0 10px 28px -14px rgba(29, 56, 107, .35);

  /* same in both themes: they sit on fixed palette colors */
  --on-b: #1D386B; --on-l: #13305E; --on-d: #FFF2C6;
  --done-word-b: #2E5AA7; --done-word-l: #FFF6D8; --done-word-d: #FFA62B;
  --chip-bg: rgba(255, 255, 255, .66); --chip-ink: #1D386B;
  --hero-bg: #F8E6A0; --hero-ink: #1D386B; --hero-ink-2: #4B5F87;
  --sp-ink: #13305E; --sp-ink-2: #3F557F; --breeze-deep: #4FA3EE;

  --font-script: "Sacramento", "Snell Roundhand", "Segoe Script", cursive;
  --font-zh: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "STKaiti", serif;
  --font-ui: "Manrope", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
:root:lang(zh-Hans) {
  --font-zh: "LXGW WenKai TC", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --font-ui: "Manrope", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1830; --surface: #13223F; --raised: #192B4D;
    --ink: #FBEFCB; --ink-2: #AFBCD7; --ink-3: #6D7EA2;
    --line: #203457; --line-2: #2C4570;
    --accent: #FFA62B; --on-accent: #13223F; --focus: #FFA62B;
    --ok: #5BD08A; --ok-ink: #7FDCA2; --danger: #FF9C86;
    --tint-b: #1B2843; --tint-l: #172A4A; --tint-d: #172750;
    --edge-b: #8E6A33; --edge-l: #3F6E9E; --edge-d: #4769AE;
    --mark-b: #FFA62B; --mark-l: #86C5FF; --mark-d: #7FA5F2;
    --word-b: #FFA62B; --word-l: #86C5FF; --word-d: #8FB2F5;
    --full-bg: #1E3359;
    --scrim: rgba(3, 8, 20, .62);
    --nav-bg: rgba(13, 24, 48, .94);
    --shadow: 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; display: block; height: 6px;
  background: repeating-linear-gradient(90deg, var(--amalfi) 0 18px, var(--bg) 18px 24px, var(--breeze) 24px 32px, var(--bg) 32px 38px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
html.lock body { overflow: hidden; }
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }

.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(108px + env(safe-area-inset-bottom, 0px)); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-zh); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: .06em; }
.brand .script { font-family: var(--font-script); font-size: 30px; line-height: 1; color: var(--word-b); -webkit-text-stroke: .3px currentColor; white-space: nowrap; }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line-2); font-size: 13.5px; }
.tip { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--tint-l); font-size: 13.5px; display: grid; gap: 8px; }
.tip b { font-family: var(--font-zh); font-size: 15px; }
.tip .row { display: flex; justify-content: flex-end; }

/* day header (meals + water) */
.dayhead { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-top: 18px; gap: 8px; }
.nav-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.nav-btn:disabled { opacity: .35; cursor: default; }
.dayname { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; }
.dayname .d1 { font-family: var(--font-zh); font-size: 22px; font-weight: 700; line-height: 1.25; }
.dayname .d2 { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dayname input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.hello { margin: 14px 0 0; font-size: 15px; color: var(--ink-2); text-wrap: pretty; }
.hello b { color: var(--ink); font-family: var(--font-zh); font-size: 17px; margin-right: 4px; }
.meter { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.pip { width: 22px; height: 6px; border-radius: 3px; background: var(--line-2); }
.pip.on.b { background: var(--mark-b); } .pip.on.l { background: var(--mark-l); } .pip.on.d { background: var(--mark-d); }
.pip.skip { background: var(--ink-3); }
.meter-t { font-size: 12.5px; color: var(--ink-2); margin-left: 4px; font-variant-numeric: tabular-nums; }

/* meal cards */
.meals { display: grid; gap: 12px; margin-top: 16px; }
.meal { --solid: var(--citrus); --on: var(--on-b); --tint: var(--tint-b); --edge: var(--edge-b); --word: var(--word-b); --dword: var(--done-word-b);
  position: relative; border-radius: 22px; padding: 16px 18px 18px; background: var(--tint); color: var(--ink); border: 1.5px dashed var(--edge); }
.meal.l { --solid: var(--breeze); --on: var(--on-l); --tint: var(--tint-l); --edge: var(--edge-l); --word: var(--word-l); --dword: var(--done-word-l); }
.meal.d { --solid: var(--amalfi); --on: var(--on-d); --tint: var(--tint-d); --edge: var(--edge-d); --word: var(--word-d); --dword: var(--done-word-d); }
.meal.is-now { border: 2px solid var(--solid); }
.meal.done { background: var(--solid); color: var(--on); border: 1.5px solid var(--solid); cursor: pointer; }
.meal.skipped { cursor: pointer; }
.mh { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mh .en { font-family: var(--font-script); font-size: 44px; line-height: .85; color: var(--word); -webkit-text-stroke: .45px currentColor; padding-top: 6px; white-space: nowrap; }
.meal.done .mh .en { color: var(--dword); }
.meal.l.done .mh .en { text-shadow: 0 1px 0 rgba(19, 48, 94, .3); }
.meal.skipped .mh .en { opacity: .55; }
.mt { display: flex; flex-direction: column; align-items: flex-end; text-align: right; flex: none; }
.mt b { font-family: var(--font-zh); font-size: 17px; font-weight: 700; letter-spacing: .08em; }
.mt .win { font-size: 12.5px; font-variant-numeric: tabular-nums; opacity: .8; }
.hint { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.meal.is-now .hint { color: var(--ink); font-weight: 600; }
.pulse { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--solid); flex: none; }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(2.8); opacity: 0; } }
.acts { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.mb { display: flex; gap: 14px; align-items: flex-end; justify-content: space-between; margin-top: 14px; }
.mb-text { min-width: 0; flex: 1; }
.when { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock { font-size: 30px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-ink); white-space: nowrap; }
.chip.off { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.chip.skip { background: var(--ink); color: var(--bg); }
.note { margin: 8px 0 0; font-size: 15.5px; overflow-wrap: anywhere; font-family: var(--font-zh); }
.note.muted { opacity: .7; }
.thumb { flex: none; width: 76px; height: 76px; border-radius: 16px; overflow: hidden; padding: 0; border: 2px solid rgba(255, 255, 255, .75); background: var(--chip-bg); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.sm { width: 52px; height: 52px; border-radius: 12px; border-color: var(--surface); }
img.broken { visibility: hidden; }
.link-btn { margin: 18px auto 0; display: block; background: none; border: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }

/* buttons */
.btn { font: 700 15px var(--font-ui); border-radius: 999px; padding: 10px 18px; border: 1.5px solid transparent; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.solid { background: var(--solid); color: var(--on); }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--ink); }
.meal .btn.ghost { border-color: var(--edge); }
.btn.text { background: none; border: 0; color: var(--danger); padding-inline: 6px; }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.btn:disabled { opacity: .6; cursor: progress; }
.chip-btn { font: 700 13px var(--font-ui); border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); border-radius: 999px; padding: 7px 13px; cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* shared cards */
.ov-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.vt { font-family: var(--font-zh); font-size: 22px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 12px; }
.card-h { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.card-h.row { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.card-h h3, .card h3 { font-family: var(--font-zh); font-size: 17px; margin: 0; }
.card-h .sub, .sub { font-size: 12.5px; color: var(--ink-2); }
.card.empty p { color: var(--ink-2); margin: 6px 0 14px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; font: 700 13px var(--font-ui); padding: 7px 14px; border-radius: 999px; color: var(--ink-2); cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
.seg.wide { display: grid; grid-template-columns: 1fr 1fr; }
.seg.wide button { min-height: 40px; font-size: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.fl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.tin { font: 700 16px var(--font-ui); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; min-height: 44px; width: 100%; min-width: 0; }
textarea.tin { font: 500 16px/1.5 var(--font-ui); resize: vertical; min-height: 64px; }
.form-err { color: var(--danger); font-size: 13.5px; margin: 10px 0 0; }
.form-acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.empty-line { color: var(--ink-2); font-size: 14px; margin: 12px 0 0; }

/* overview */
.range-note { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kl { font-size: 12.5px; color: var(--ink-2); }
.kv { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kv small { font-size: 14px; font-weight: 700; margin-left: 3px; }
.ks { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.kpi.hero { grid-column: 1 / -1; background: var(--hero-bg); border-color: transparent; color: var(--hero-ink); display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 4px 16px; }
.kpi.hero .kl, .kpi.hero .ks { color: var(--hero-ink-2); }
.kpi.hero .kv { font-size: 46px; }
.hero-l { display: flex; flex-direction: column; gap: 2px; }
.week { display: flex; gap: 6px; justify-content: flex-end; align-self: center; }
.week span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--hero-ink-2); }
.week i { width: 18px; height: 18px; border-radius: 6px; background: rgba(46, 90, 167, .13); }
.week i.part { background: rgba(46, 90, 167, .38); }
.week i.full { background: #2E5AA7; }
.kpi.hero .ks { grid-column: 1 / -1; }
.chart { width: 100%; min-height: 250px; }
.chart svg { display: block; width: 100%; height: auto; }
.ch-today { fill: var(--ink); fill-opacity: .05; }
.ch-band.b { fill: var(--mark-b); fill-opacity: .17; } .ch-band.l { fill: var(--mark-l); fill-opacity: .17; } .ch-band.d { fill: var(--mark-d); fill-opacity: .15; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-txt { fill: var(--ink-2); font: 500 11px var(--font-ui); font-variant-numeric: tabular-nums; }
.ch-txt.today { fill: var(--ink); font-weight: 800; }
.ch-empty { fill: var(--ink-2); font: 500 13px var(--font-ui); }
.ch-line { fill: none; stroke-width: 1.5; stroke-opacity: .5; stroke-linejoin: round; }
.ch-line.b { stroke: var(--mark-b); } .ch-line.l { stroke: var(--mark-l); } .ch-line.d { stroke: var(--mark-d); }
.ch-hit { fill: transparent; cursor: pointer; }
.ch-dot { stroke: var(--surface); stroke-width: 1.5; pointer-events: none; }
.ch-dot.b { fill: var(--mark-b); } .ch-dot.l { fill: var(--mark-l); } .ch-dot.d { fill: var(--mark-d); }
.ch-dot.off { fill: var(--surface); stroke-width: 2.2; }
.ch-dot.off.b { stroke: var(--mark-b); } .ch-dot.off.l { stroke: var(--mark-l); } .ch-dot.off.d { stroke: var(--mark-d); }
.ch-pt.sel .ch-dot { stroke: var(--ink); stroke-width: 2.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.lg.b { --c: var(--mark-b); } .lg.l { --c: var(--mark-l); } .lg.d { --c: var(--mark-d); }
.lg i.solid { background: var(--ink-2); }
.lg i.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--ink-2); }
.lg i.band { width: 16px; height: 10px; border-radius: 3px; background: var(--ink-2); opacity: .25; }
.pick { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; min-height: 1.5em; overflow-wrap: anywhere; }
.pick b { color: var(--ink); }
.pm { display: grid; gap: 16px; }
.pm-row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; }
.pm-row.b { --c: var(--mark-b); } .pm-row.l { --c: var(--mark-l); } .pm-row.d { --c: var(--mark-d); }
.pm-l { display: flex; flex-direction: column; }
.pm-l b { font-family: var(--font-zh); font-size: 16px; display: flex; align-items: center; gap: 6px; }
.pm-l b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pm-l span { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pm-r { min-width: 0; }
.bar { display: flex; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--c); }
.bar i.off { opacity: .4; }
.pm-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.pm-meta b { color: var(--ink); font-weight: 700; }
.tip-s { font-size: 12px; color: var(--ink-2); margin: 14px 0 0; }
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cal-h .nav-btn { width: 36px; height: 36px; }
.cal-h .mid { text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { font-size: 11px; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.cday { aspect-ratio: 1 / 1.1; border: 0; background: transparent; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--ink); font: 600 13px var(--font-ui); cursor: pointer; padding: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.cday.full { background: var(--full-bg); }
.cday.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.cday:disabled { color: var(--ink-3); cursor: default; }
.cdots { display: flex; gap: 3px; height: 6px; align-items: center; }
.cd { width: 6px; height: 6px; border-radius: 50%; }
.cd.b { --c: var(--mark-b); } .cd.l { --c: var(--mark-l); } .cd.d { --c: var(--mark-d); }
.cd.ok { background: var(--c); }
.cd.off { box-shadow: inset 0 0 0 1.5px var(--c); }
.cd.skip { height: 2px; border-radius: 1px; background: var(--ink-3); }
.cd.miss { background: var(--line-2); }
.cal-legend { margin-top: 12px; }

/* water */
.w-top { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.glass svg { display: block; width: 74px; height: auto; }
.g-out { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.g-water { fill: var(--mark-l); }
.g-shine { fill: none; stroke: var(--surface); stroke-width: 3; stroke-linecap: round; opacity: .55; }
.w-num { min-width: 0; }
.w-num .script { font-family: var(--font-script); font-size: 34px; line-height: .9; color: var(--word-l); -webkit-text-stroke: .35px currentColor; }

<script>
(() => {
'use strict';

const MEALS = [
  { key: 'breakfast', zh: '早餐', en: 'breakfast', c: 'b' },

const TIP_KEY = 'citrus-days-install-tip';
const WD = ['日', '一', '二', '三', '四', '五', '六'];

/* opening greetings: [salutation, sentence]; the nickname goes after the salutation */
const GREETINGS = {
  night: [

    ['該吃飯囉', '今天的午餐想吃什麼呢？'],

  ],
  afternoon: [

const periodOf = h => (h < 5 ? 'night' : h < 11 ? 'morning' : h < 14 ? 'noon' : h < 18 ? 'afternoon' : 'evening');

/* ---------- on-phone storage (IndexedDB) ---------- */
const DB_NAME = 'citrus-days';
let idb = null;
function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no-idb')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      ['meals', 'water', 'drinks', 'settings', 'photos'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('blocked'));
  });
}
function idbRun(store, mode, fn) {
  return new Promise((resolve, reject) => {
    if (!idb) { reject(new Error('no-idb')); return; }
    const t = idb.transaction(store, mode);
    let result;
    const r = fn(t.objectStore(store));
    if (r && typeof r === 'object' && 'onsuccess' in r) r.onsuccess = () => { result = r.result; };
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('abort'));
  });
}
const idbGet = (s, k) => idbRun(s, 'readonly', st => st.get(k));
const idbPut = (s, k, v) => idbRun(s, 'readwrite', st => st.put(v, k));
const idbDel = (s, k) => idbRun(s, 'readwrite', st => st.delete(k));
function idbEntries(s) {
  return new Promise((resolve, reject) => {
    const out = [];
    const t = idb.transaction(s, 'readonly');
    const req = t.objectStore(s).openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
  });
}
async function loadAll() {
  const fill = async (coll, key) => {
    const out = {};
    for (const [k, v] of await idbEntries(coll)) if (isKey(k) && v && typeof v === 'object') out[k] = v;
    S[key] = out;
  };
  await fill('meals', 'days');
  await fill('water', 'water');
  await fill('drinks', 'drinks');
  const st = await idbGet('settings', 'main');
  if (st) {
    S.windows = normalizeWindows(st.windows);
    S.profile = normalizeProfile(st);
    S.onboarded = !!st.onboarded;
  }
}
let persistAsked = false;

/* ---------- photos (kept on this phone) ---------- */
const photoUrls = new Map();
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('encode'))), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
async function storePhoto(file) {
  let blob;
  try { blob = await shrink(file); } catch (e) {
    if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) blob = file; else throw { code: 'decode' };
  }
  const id = uid();
  const data = await blob.arrayBuffer();
  await idbPut('photos', id, { type: blob.type || 'image/jpeg', data });
  requestPersist();
  return id;
}
async function photoUrl(id) {
  if (!id) return null;
  if (photoUrls.has(id)) return photoUrls.get(id);
  let rec = null;
  try { rec = await idbGet('photos', id); } catch (e) { rec = null; }
  if (!rec || !rec.data) return null;
  const url = URL.createObjectURL(new Blob([rec.data], { type: rec.type || 'image/jpeg' }));
  photoUrls.set(id, url);
  return url;
}
function dropPhoto(id) {
  if (!id) return;
  idbDel('photos', id).catch(() => {});
  const u = photoUrls.get(id);
  if (u) { URL.revokeObjectURL(u); photoUrls.delete(id); }
}
function hydratePhotos(root) {
  (root || document).querySelectorAll('img[data-photo]').forEach(img => {
    const id = img.dataset.photo;
    if (img.dataset.loaded === id) return;
    photoUrl(id).then(u => { if (u) { img.src = u; img.dataset.loaded = id; } else img.classList.add('broken'); });
  });
}

async function buildBackup() {

    if (!rec || !rec.data) continue;
    const type = rec.type || 'image/jpeg';
    const b64 = await blobToBase64(new Blob([rec.data], { type }));
    parts.push((first ? '' : ',') + JSON.stringify(String(id)) + ':' + JSON.stringify({ type, data: b64 }));

/* ---------- evaluation ---------- */
function evalMeal(k, meal) {
  const e = S.days[k] && S.days[k][meal];
  const w = S.windows[meal];
  const s = toMin(w.start), en = toMin(w.end);
  if (e && e.status === 'eaten' && isTime(e.time)) {
    const t = toMin(e.time);
    if (t < s) return { kind: 'early', diff: s - t, e };
    if (t > en) return { kind: 'late', diff: t - en, e };
    return { kind: 'ontime', e };
  }
  if (e && e.status === 'skipped') return { kind: 'skipped', e };
  const tk = todayKey();
  if (k > tk) return { kind: 'future' };
  if (k === tk) {
    const n = nowMin();
    if (n < s) return { kind: 'upcoming' };
    if (n <= en) return { kind: 'now' };
  }
  return { kind: 'missing' };
}
const fullDay = k => MEALS.every(m => EATEN.has(evalMeal(k, m.key).kind));
const anyEaten = k => MEALS.some(m => EATEN.has(evalMeal(k, m.key).kind));

function firstRecordKey() {
  let f = null;
  for (const k in S.days) {
    if (!isKey(k)) continue;
    if (MEALS.some(m => S.days[k] && S.days[k][m.key]) && (!f || k < f)) f = k;
  }
  return f;
}
function currentStreak() {
  let k = todayKey();
  if (!fullDay(k)) k = addDays(k, -1);
  let n = 0;
  while (fullDay(k) && n < 3660) { n++; k = addDays(k, -1); }
  return n;
}
function bestStreak() {
  const keys = Object.keys(S.days).filter(k => isKey(k) && fullDay(k)).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k => { run = prev && addDays(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; });
  return best;
}
function computeStats(N) {
  const tk = todayKey(), first = firstRecordKey();

  const dates = Array.from({ length: N }, (_, i) => addDays(tk, i - N + 1));
  const counted = dates.filter(k => k >= first);
  const per = {}, tot = { eaten: 0, expected: 0, ontime: 0 };
  MEALS.forEach(m => {
    const p = per[m.key] = { eaten: 0, expected: 0, ontime: 0, off: 0, gap: 0, times: [] };
    counted.forEach(k => {
      const r = evalMeal(k, m.key);
      if (EATEN.has(r.kind)) {
        p.eaten++; p.expected++; p.times.push(toMin(r.e.time));
        if (r.kind === 'ontime') p.ontime++; else p.off++;
      } else if (r.kind === 'skipped' || r.kind === 'missing') { p.expected++; p.gap++; }
    });
    const n = p.times.length;
    p.avg = n ? p.times.reduce((a, b) => a + b, 0) / n : null;
    p.sd = n >= 2 ? Math.sqrt(p.times.reduce((a, t) => a + (t - p.avg) ** 2, 0) / n) : null;
    tot.eaten += p.eaten; tot.expected += p.expected; tot.ontime += p.ontime;
  });
  return { dates, counted, first, per, tot, streak: currentStreak(), best: bestStreak() };
}

function waterLogs(k) {
  const d = S.water[k];
  return (d && Array.isArray(d.logs) ? d.logs : [])
    .filter(l => l && l.id && isTime(l.time) && Number(l.ml) > 0)
    .slice().sort((a, b) => a.time.localeCompare(b.time) || String(a.at || '').localeCompare(String(b.at || '')));
}
const waterTotal = k => waterLogs(k).reduce((a, l) => a + Number(l.ml), 0);
function drinkItems(k) {
  const d = S.drinks[k];
  return (d && Array.isArray(d.items) ? d.items : [])
    .filter(x => x && x.id)
    .slice().sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
}

/* ---------- copy ---------- */
function helloWord() {
  const h = new Date().getHours();
  return h < 5 ? '還沒睡嗎' : h < 11 ? '早安' : h < 14 ? '午安' : h < 18 ? '下午好' : '晚上好';
}
function dayMessage(k) {
  const res = MEALS.map(m => ({ m, r: evalMeal(k, m.key) }));
  const logged = res.filter(x => x.r.e).length;
  const eaten = res.filter(x => EATEN.has(x.r.kind)).length;
  if (k !== todayKey()) {
    if (!logged) return '這天還沒有紀錄，想到的話可以補記。';
    return `這天吃了 ${eaten} 餐${eaten === 3 ? '，三餐齊全。' : '。'}`;
  }
  const now = res.find(x => x.r.kind === 'now');
  if (now) return `${now.m.zh}時間到了，記得好好吃一頓。`;
  if (logged === 3) {
    if (res.every(x => x.r.kind === 'ontime')) return '今天三餐都準時，很棒。';
    return '今天三餐都記好了，辛苦了。';
  }
  const missing = res.filter(x => x.r.kind === 'missing');
  if (missing.length) return `${missing.map(x => x.m.zh).join('、')}還沒記錄，吃過的話補記一下。`;
  const next = res.find(x => x.r.kind === 'upcoming');
  if (next) return `下一餐是${next.m.zh}，${S.windows[next.m.key].start} 開始。`;
  return '';
}
function relLabel(k) {
  const tk = todayKey();
  if (k === tk) return '今天';
  if (k === addDays(tk, -1)) return '昨天';
  if (k === addDays(tk, -2)) return '前天';
  const d = Math.round((parseKey(tk) - parseKey(k)) / 864e5);
  return `${d} 天前`;
}
function statusLabel(r) {
  if (r.kind === 'ontime') return '準時';
  if (r.kind === 'early') return `早了 ${fmtDiff(r.diff)}`;
  if (r.kind === 'late') return `晚了 ${fmtDiff(r.diff)}`;
  if (r.kind === 'skipped') return '沒吃';
  return '';
}

function mealCard(k, m, r) {
  const w = S.windows[m.key];
  const e = r.e;
  const done = !!e && e.status === 'eaten';
  const skipped = !!e && e.status === 'skipped';
  const cls = ['meal', m.c, done ? 'done' : '', skipped ? 'skipped' : '', r.kind === 'now' ? 'is-now' : ''].join(' ');
  const head = `<div class="mh"><span class="en" aria-hidden="true">${m.en}</span>
    <span class="mt"><b>${m.zh}</b><span class="win">${w.start} – ${w.end}</span></span></div>`;
  if (done || skipped) {
    const chip = done
      ? `<span class="chip ${r.kind === 'ontime' ? '' : 'off'}">${r.kind === 'ontime' ? '✓ ' : ''}${statusLabel(r)}</span>`
      : `<span class="chip skip">沒吃</span>`;
    const photo = done && e.photo
      ? `<button class="thumb" data-act="photo" data-k="${k}" data-m="${m.key}" aria-label="看${m.zh}的照片"><img data-photo="${esc(e.photo)}" alt=""></button>` : '';
    return `<article class="${cls}" data-act="edit" data-m="${m.key}" tabindex="0" aria-label="${m.zh}，${done ? esc(e.time) : '沒吃'}。點一下修改">${head}
      <div class="mb"><div class="mb-text">
        <div class="when">${done ? `<span class="clock">${esc(e.time)}</span>` : ''}${chip}</div>
        ${e.note ? `<p class="note ${skipped ? 'muted' : ''}" data-raw>${esc(e.note)}</p>` : ''}
      </div>${photo}</div></article>`;
  }
  let hint;
  if (r.kind === 'now') hint = `<span class="pulse"></span>現在是${m.zh}時間`;
  else if (r.kind === 'upcoming') hint = `${w.start} 開始`;
  else if (k === todayKey()) hint = '時段過了，還沒記錄';
  else hint = '沒有紀錄';
  return `<article class="${cls}">${head}<p class="hint">${hint}</p><div class="acts">
      <button class="btn solid" data-act="log" data-m="${m.key}">記錄${m.zh}</button>
      <button class="btn ghost" data-act="skip" data-m="${m.key}">沒吃</button></div></article>`;
}

    ? `<path class="g-water" d="M0 ${(y + 1).toFixed(1)} q9.25 -4 18.5 0 t18.5 0 t18.5 0 t18.5 0 V${(y + 8).toFixed(1)} H0Z"/>` : '';
  return `<svg viewBox="0 0 74 112" aria-hidden="true"><defs><clipPath id="glass-clip"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#glass-clip)"><rect class="g-water" x="0" y="${(y + 3).toFixed(1)}" width="74" height="${Math.max(0, 112 - y).toFixed(1)}"/>${wave}</g>
    <path class="g-out" d="${shape}"/><path class="g-shine" d="M19 20l4 68"/></svg>`;
}

function waterWeekCard() {
  const tk = todayKey(), goal = S.profile.waterGoal;
  const days = Array.from({ length: 7 }, (_, i) => addDays(tk, i - 6));
  const vals = days.map(waterTotal);
  const max = Math.max(goal || 0, ...vals, 500) * 1.18;
  const logged = vals.filter(v => v > 0);
  const reach = goal ? vals.filter(v => v >= goal).length : 0;
  const avg = logged.length ? logged.reduce((a, b) => a + b, 0) / logged.length : 0;
  const cols = days.map((k, i) => {
    const v = vals[i];
    const h = v ? Math.max(3, v / max * 100) : 0;
    return `<div class="wcol"><span class="wv">${v ? fmtNum(v) : ''}</span><i class="${v ? (goal && v >= goal ? 'reach' : '') : 'none'}" style="height:${v ? h.toFixed(1) + '%' : '2px'}"></i></div>`;
  }).join('');
  const labels = days.map(k => `<span class="${k === tk ? 'today' : ''}">${k === tk ? '今天' : '週' + WD[parseKey(k).getDay()]}</span>`).join('');
  const goalLine = goal ? `<div class="goal" style="bottom:${(goal / max * 100).toFixed(1)}%"><span>目標 ${fmtNum(goal)}</span></div>` : '';

  const all = days.flatMap(k => drinkItems(k));
  const dSweet = all.filter(x => x.sugar && x.sugar !== 'none').length;
  const dPrice = all.reduce((a, x) => a + (Number(x.price) || 0), 0);
  const dMl = all.reduce((a, x) => a + (Number(x.ml) || 0), 0);
  const kinds = {};
  all.forEach(x => { const z = KIND[x.kind] || '其他'; kinds[z] = (kinds[z] || 0) + 1; });
  const kindText = Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([z, n]) => `${z} ${n}`).join('、');
  return `<section class="card"><div class="card-h"><h3>近 7 天</h3><span class="sub">深色長條是達到目標的日子</span></div>
    <div class="wchart" role="img" aria-label="近 7 天每天喝水量">
      <div class="wplot">${goalLine}${cols}</div>
      <div class="wlabels">${labels}</div>
    </div>
    <div class="wsum">
      ${goal ? `<span>達標 <b>${reach}</b> / 7 天</span>` : ''}
      <span>${logged.length ? `有記錄的 ${logged.length} 天平均 <b>${fmtNum(avg)} ml</b>` : '還沒有喝水紀錄'}</span>
    </div>
    <div class="wsum">
      <span>飲品 <b>${all.length}</b> 杯${dMl ? ` · ${fmtNum(dMl)} ml` : ''}</span>
      ${all.length ? `<span>含糖 <b>${dSweet}</b> 杯</span>` : ''}
      ${dPrice ? `<span>花費 <b>${fmtNum(dPrice)}</b> 元</span>` : ''}
      ${kindText ? `<span>${kindText}</span>` : ''}
    </div></section>`;
}
async function addWater() {
  const mlEl = $('w-ml'), tEl = $('w-time'), err = $('w-err');
  const ml = Math.round(Number(mlEl.value));

  const fail = m => { err.textContent = tx(m); err.hidden = false; };

  if (!isTime(time)) { fail('填上喝水的時間。'); return; }

      <p class="tip-s">波動是用餐時間和平均差多少。數字越小，代表那一餐的時間越固定。</p></section>
    ${calendarCard()}`;
  drawChart();
  localize(el);
}

function drawChart() {
  const box = $('chart');
  if (!box) return;
  const W = Math.round(Math.max(280, box.clientWidth || 320)), H = 250;
  const N = S.range, tk = todayKey();
  const dates = Array.from({ length: N }, (_, i) => addDays(tk, i - N + 1));
  const pts = [];
  dates.forEach((k, i) => MEALS.forEach(m => {
    const r = evalMeal(k, m.key);
    if (EATEN.has(r.kind)) pts.push({ k, i, m, t: toMin(r.e.time), r });
  }));
  let lo = 7 * 60, hi = 20 * 60;
  MEALS.forEach(m => { const w = S.windows[m.key]; lo = Math.min(lo, toMin(w.start)); hi = Math.max(hi, toMin(w.end)); });
  pts.forEach(p => { lo = Math.min(lo, p.t); hi = Math.max(hi, p.t); });
  lo = Math.max(0, Math.floor((lo - 30) / 60) * 60);
  hi = Math.min(1440, Math.ceil((hi + 30) / 60) * 60);
  const L = 42, R = 6, T = 8, B = 24;
  const pw = W - L - R, ph = H - T - B, cw = pw / N;
  const X = i => L + (i + 0.5) * cw;
  const Y = t => T + (t - lo) / (hi - lo) * ph;
  const step = hi - lo > 13 * 60 ? 180 : 120;
  let g = `<rect class="ch-today" x="${(L + (N - 1) * cw).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ph}" rx="6"/>`;
  MEALS.forEach(m => {
    const w = S.windows[m.key], y1 = Y(toMin(w.start)), y2 = Y(toMin(w.end));
    g += `<rect class="ch-band ${m.c}" x="${L}" y="${y1.toFixed(1)}" width="${pw}" height="${Math.max(2, y2 - y1).toFixed(1)}" rx="3"/>`;
  });
  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) {
    const y = Y(t).toFixed(1);
    g += `<line class="ch-grid" x1="${L}" x2="${L + pw}" y1="${y}" y2="${y}"/><text class="ch-txt" x="${L - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${fromMin(t)}</text>`;
  }
  dates.forEach((k, i) => {
    if (N > 7 && (N - 1 - i) % 7 !== 0) return;
    const isT = k === tk;
    g += `<text class="ch-txt ${isT ? 'today' : ''}" x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${isT ? '今天' : fmtShort(k)}</text>`;
  });
  MEALS.forEach(m => {
    const ps = pts.filter(p => p.m === m);
    let d = '';
    ps.forEach((p, j) => { const prev = ps[j - 1]; d += (prev && prev.i === p.i - 1 ? 'L' : 'M') + X(p.i).toFixed(1) + ' ' + Y(p.t).toFixed(1); });
    if (d.includes('L')) g += `<path class="ch-line ${m.c}" d="${d}"/>`;
  });
  const r = N <= 7 ? 6 : 4.2;
  pts.forEach((p, j) => {
    const cx = X(p.i).toFixed(1), cy = Y(p.t).toFixed(1);
    g += `<g class="ch-pt" data-act="pt" data-j="${j}"><circle class="ch-hit" cx="${cx}" cy="${cy}" r="${Math.max(11, r + 6)}"/><circle class="ch-dot ${p.m.c} ${p.r.kind === 'ontime' ? '' : 'off'}" cx="${cx}" cy="${cy}" r="${r}"/></g>`;
  });
  if (!pts.length) g += `<text class="ch-empty" x="${(L + pw / 2).toFixed(1)}" y="${(T + ph / 2 + 4).toFixed(1)}" text-anchor="middle">記錄之後，這裡會出現每一餐的時間點</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 ${N} 天每一餐的用餐時間">${g}</svg>`;
  S.pts = pts;
  localize(box);
}

function pickPoint(el) {
  const p = S.pts[+el.dataset.j];
  if (!p) return;
  document.querySelectorAll('.ch-pt.sel').forEach(n => n.classList.remove('sel'));
  el.classList.add('sel');
  const note = p.r.e.note ? ` · <span data-raw>${esc(p.r.e.note)}</span>` : '';
  const out = $('pick');
  out.innerHTML = `<b>${fmtDate(p.k)} ${p.m.zh} ${esc(p.r.e.time)}</b> · ${statusLabel(p.r)}${note}`;
  localize(out);
}

function calendarCard() {
  const { y, m } = S.cal;
  const now = new Date();
  const atCurrent = y === now.getFullYear() && m === now.getMonth();
  const first = new Date(y, m, 1), dim = new Date(y, m + 1, 0).getDate();
  const tk = todayKey(), fr = firstRecordKey();
  let cells = WD.map(w => `<span class="cal-wd">${w}</span>`).join('');
  for (let i = 0; i < first.getDay(); i++) cells += '<span></span>';
  for (let d = 1; d <= dim; d++) {
    const k = keyOf(new Date(y, m, d));
    const future = k > tk;
    let dots = '';
    if (!future) {
      dots = MEALS.map(meal => {
        const r = evalMeal(k, meal.key);
        let c = 'none';
        if (r.kind === 'ontime') c = 'ok';
        else if (EATEN.has(r.kind)) c = 'off';
        else if (r.kind === 'skipped') c = 'skip';
        else if (r.kind === 'missing' && fr && k >= fr) c = 'miss';
        return `<i class="cd ${meal.c} ${c}"></i>`;
      }).join('');
    }
    cells += `<button class="cday ${!future && fullDay(k) ? 'full' : ''} ${k === tk ? 'today' : ''}" data-act="goto" data-k="${k}" ${future ? 'disabled' : ''} aria-label="${fmtDate(k)}">
      <span>${d}</span><span class="cdots">${dots}</span></button>`;
  }
  return `<section class="card" id="cal-card">
    <div class="cal-h">
      <button class="nav-btn" data-act="cal" data-n="-1" aria-label="上個月">${ICON.left}</button>
      <div class="mid"><h3>${y} 年 ${m + 1} 月</h3><span class="sub">點日期可以查看或補記那天</span></div>
      <button class="nav-btn" data-act="cal" data-n="1" aria-label="下個月" ${atCurrent ? 'disabled' : ''}>${ICON.right}</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="legend cal-legend">
      <span class="lg"><i class="solid"></i>準時</span><span class="lg"><i class="ring"></i>不在時段</span>
      <span class="lg"><i class="band" style="height:3px"></i>沒吃</span>
      <span class="lg"><i style="background:var(--line-2)"></i>沒記錄</span>
      <span class="lg"><i class="band" style="background:var(--full-bg);opacity:1;box-shadow:inset 0 0 0 1px var(--line-2)"></i>三餐都吃</span>
    </div></section>`;
}

async function saveWindows() {
  const w = {};
  let err = '';
  MEALS.forEach(m => {
    const s = $(`w-${m.key}-start`).value, e = $(`w-${m.key}-end`).value;
    if (!isTime(s) || !isTime(e)) err = err || `${m.zh}的時間沒有填完整。`;
    else if (toMin(s) >= toMin(e)) err = err || `${m.zh}的結束時間要比開始時間晚。`;
    w[m.key] = { start: s, end: e };
  });
  const box = $('win-err');
  if (err) { box.textContent = tx(err); box.hidden = false; return; }
  box.hidden = true;
  const prev = S.windows;
  S.windows = w;
  S.dirty.w = false;
  if (await writeSettings()) toast('時段已儲存'); else S.windows = prev;
  renderSettings();
}
async function saveProfile() {
  const nick = $('p-nick').value.trim().slice(0, 20);
  const goalRaw = $('p-goal').value.trim();
  const goal = goalRaw === '' ? 0 : Math.round(Number(goalRaw));
  const box = $('p-err');
  if (!Number.isFinite(goal) || goal < 0 || goal > 10000) { box.textContent = tx('喝水目標填 0 到 10000 之間的數字。'); box.hidden = false; return; }
  box.hidden = true;
  const prev = S.profile;
  S.profile = { ...S.profile, nickname: nick, waterGoal: goal };
  S.dirty.p = false;
  if (await writeSettings()) toast('已儲存'); else S.profile = prev;
  renderSettings();
}

}

async function saveDrink() {
  const E = S.edit;
  if (!E || E.busy) return;
  readSheet();
  const fail = m => { E.error = tx(m); renderSheet(); };
  if (!E.kind) return fail('選一下是哪一種飲品。');
  if (!isTime(E.time)) return fail('填上喝的時間。');
  const ml = E.ml === '' ? null : Math.round(Number(E.ml));
  if (ml != null && (!ml || ml < 1 || ml > 3000)) return fail('容量填 1 到 3000 之間的毫升數，或留空。');
  const price = E.price === '' ? null : Number(E.price);
  if (price != null && (!Number.isFinite(price) || price < 0 || price > 100000)) return fail('花費填 0 以上的數字，或留空。');
  E.busy = true; E.error = '';
  renderSheet();
  if (!(await withPhoto(E))) return;
  const item = { id: E.id, kind: E.kind, time: E.time, at: new Date().toISOString() };
  const name = E.name.trim().slice(0, 40);
  if (name) item.name = name;
  if (ml != null) item.ml = ml;
  if (E.sugar) item.sugar = E.sugar;
  if (price != null) item.price = Math.round(price * 100) / 100;
  if (E.photo) item.photo = E.photo;
  const items = drinkItems(E.k).filter(x => x.id !== E.id).concat(item);
  const ok = await writeDoc('drinks', E.k, { date: E.k, items });
  if (!ok) {
    if (S.edit === E) { E.busy = false; E.error = tx('沒有存成功，再試一次看看。'); renderSheet(); }

  }
  if (E.origPhoto && E.origPhoto !== E.photo) dropPhoto(E.origPhoto);
  closeSheet();

/* ---------- opening splash ---------- */
const SPLASH = { hi: '', line: '', done: false, timer: 0 };
function renderSplashText() {
  if (SPLASH.done || !SPLASH.hi) return;
  const nick = S.profile.nickname;
  $('sp-hi').textContent = tx(SPLASH.hi) + (nick ? '，' + nick : '');
  $('sp-line').textContent = tx(SPLASH.line);
}
function startSplash() {
  const el = $('splash');
  const p = periodOf(new Date().getHours());
  const list = GREETINGS[p];
  let last = {};
  try { last = JSON.parse(localStorage.getItem(GREET_KEY) || '{}') || {}; } catch (e) { last = {}; }
  let i = Math.floor(Math.random() * list.length);
  if (list.length > 1 && i === last[p]) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
  last[p] = i;
  try { localStorage.setItem(GREET_KEY, JSON.stringify(last)); } catch (e) { /* ignore */ }
  [SPLASH.hi, SPLASH.line] = list[i];
  renderSplashText();
  document.documentElement.classList.add('lock');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go = () => {
    if (SPLASH.done || el.classList.contains('play') || el.classList.contains('skip')) return;
    el.classList.add('play');
    SPLASH.timer = setTimeout(endSplash, reduce ? 2600 : 4650);
  };
  // wait (briefly) for the script face so the words are written in Sacramento, not a fallback
  const tryFont = () => {
    if (!document.fonts || !document.fonts.load) return;
    document.fonts.load('100px "Sacramento"').then(f => { if (f && f.length) go(); }, () => {});
  };
  const css = $('font-css');
  tryFont();
  if (css) css.addEventListener('load', tryFont);
  setTimeout(go, 900);
}
function endSplash() {
  SPLASH.done = true;
  clearTimeout(SPLASH.timer);
  const el = $('splash');
  el.hidden = true;
  el.className = 'splash';
  if ($('sheet').hidden && $('lightbox').hidden && $('onboard').hidden) document.documentElement.classList.remove('lock');
}
function skipSplash() {
  const el = $('splash');
  if (el.hidden || el.classList.contains('skip')) return;
  clearTimeout(SPLASH.timer);
  el.classList.add('skip');
  SPLASH.timer = setTimeout(endSplash, 320);
}

    showBanner('這個瀏覽器不能存資料（可能是私密瀏覽模式），關掉頁面後紀錄就會不見。');
  }
  setScript(S.profile.script);
  renderSplashText();
  renderChrome();
  const h = location.hash.slice(1);
  setTab(TABS.includes(h) ? h : 'today');
  if (!S.onboarded) showOnboard();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
})();
</script>
</body>
</html>
